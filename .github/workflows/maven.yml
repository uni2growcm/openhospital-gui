# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on: [push, pull_request]

env:
  MAVEN_ARGS: '-B -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Debug GitHub variables
        run: |
          echo "GITHUB_EVENT_NAME: ${GITHUB_EVENT_NAME}"
          echo "GITHUB_HEAD_REPOSITORY: ${GITHUB_HEAD_REPOSITORY}"
          echo "GITHUB_HEAD_REF: ${GITHUB_HEAD_REF}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_REF: ${GITHUB_REF}"
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"

      - name: Determine PR source branch and fork repository
        id: vars
        run: |
          # Set default FORK_REPO and BRANCH_NAME values.
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF##*/}}"
          
          MAIN_CORE_REPO="uni2growcm/openhospital-core"
          if [[ "$GITHUB_REPOSITORY" == "informatici/"* ]]; then
            MAIN_CORE_REPO="informatici/openhospital-core"
          fi

          # Default to main core repo
          FORK_REPO="$MAIN_CORE_REPO"

          # If it's a pull request or a feature branch, check if the contributor's fork has a matching branch
          if [[ "$BRANCH_NAME" != "develop" && "$BRANCH_NAME" != "main" ]]; then
            ACTOR_CORE_REPO="${GITHUB_ACTOR}/openhospital-core"
            CHECK_BRANCH_URL="https://github.com/$ACTOR_CORE_REPO/tree/$BRANCH_NAME"
            echo "Checking branch existence with: curl -s -L -o /dev/null -w \"%{http_code}\" $CHECK_BRANCH_URL"

            HTTP_CODE=$(curl -s -L -o /dev/null -w "%{http_code}" "$CHECK_BRANCH_URL")
            if [[ "$HTTP_CODE" == "200" ]]; then
              echo "Branch $BRANCH_NAME exists in $ACTOR_CORE_REPO."
              FORK_REPO="$ACTOR_CORE_REPO"
            else
              echo "Branch $BRANCH_NAME not found in $ACTOR_CORE_REPO (HTTP $HTTP_CODE), fallback to $MAIN_CORE_REPO."
              FORK_REPO="$MAIN_CORE_REPO"
            fi
          fi
          
          # Export FORK_REPO and BRANCH_NAME to GITHUB_ENV for the next step
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "FORK_REPO=$FORK_REPO" >> $GITHUB_ENV

      - name: Log variables
        run: |
          echo "FORK_REPO: ${{ env.FORK_REPO }}"
          echo "BRANCH_NAME: ${{ env.BRANCH_NAME }}"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17
          java-package: jdk

      - name: Checkout core
        run: |
          CLONE_URL="https://github.com/${{ env.FORK_REPO }}.git"
          if [ -n "${{ secrets.GH_TOKEN }}" ]; then
            CLONE_URL="https://${{ secrets.GH_TOKEN }}@github.com/${{ env.FORK_REPO }}.git"
          fi
          git clone --depth=1 --no-single-branch "$CLONE_URL" ../openhospital-core
          ln -s ../openhospital-core openhospital-core || true
          ln -s ../openhospital-core u2g-openhospital-core || true

          pushd ../openhospital-core
          TARGET_BRANCH=""
          if git rev-parse --verify "origin/${{ env.BRANCH_NAME }}" >/dev/null 2>&1; then
            TARGET_BRANCH="${{ env.BRANCH_NAME }}"
          elif [ -n "${{ github.base_ref }}" ] && git rev-parse --verify "origin/${{ github.base_ref }}" >/dev/null 2>&1; then
            TARGET_BRANCH="${{ github.base_ref }}"
          elif git rev-parse --verify "origin/feature/OH-561-reports" >/dev/null 2>&1; then
            TARGET_BRANCH="feature/OH-561-reports"
          elif git rev-parse --verify "origin/feature/OH-568-mada-enhancement" >/dev/null 2>&1; then
            TARGET_BRANCH="feature/OH-568-mada-enhancement"
          elif git rev-parse --verify "origin/develop" >/dev/null 2>&1; then
            TARGET_BRANCH="develop"
          elif git rev-parse --verify "origin/main" >/dev/null 2>&1; then
            TARGET_BRANCH="main"
          fi

          if [ -n "$TARGET_BRANCH" ]; then
            echo "Checking out core branch: $TARGET_BRANCH"
            git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"
          else
            echo "Using default checked out branch in core"
          fi
          git log -n 1 --oneline
          popd
        
      - name: Install core
        run: |
          pushd ../openhospital-core
          mvn install -DskipTests=true
          popd

      - name: Build GUI with Maven
        run: mvn -B package --file pom.xml
